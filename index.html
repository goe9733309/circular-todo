    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
  }

  .app {
    display: flex;
    min-height: 100vh;
  }

  .clock-panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: transparent;
    --clock-font: 'Noto Sans KR', sans-serif;
    --title-font-size: 22px;
    --time-font-size: 40px;
  }

  .live-time-title {
    margin-bottom: 10px;
    text-align: center;
    animation: heroFadeIn 0.6s var(--ease) both;
  }

  .title-text {
    font-size: var(--title-font-size);
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin-bottom: 4px;
    font-family: var(--clock-font);
  }

  .time-text {
    font-size: var(--time-font-size);
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    font-family: var(--clock-font);
  }

  .live-time-title.mode-time .title-text {
    display: none;
  }

  .live-time-title.mode-title .time-text {
    display: none;
  }

  #clock-svg {
    width: 100%;
    max-width: 840px;
    height: auto;
    margin-top: 0;
    animation: clockScaleIn 0.7s var(--ease) both;
  }

  .list-panel {
    flex: 0 0 260px;
    max-width: 260px;
    padding: 18px 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    font-family: inherit;
  }

  .list-panel .event-list {
    max-height: none;
  }

  .side-panel {
    flex: 0 0 300px;
    max-width: 300px;
    padding: 18px 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    font-family: inherit;
  }

  .list-panel h2,
  .side-panel h2 {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px var(--shadow-soft);
    transition: box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
  }

  .card-settings summary {
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  .card-settings[open] summary {
    margin-bottom: 10px;
  }

  .details-body > .row-2:not(:last-child),
  .details-body > .field:not(:last-child),
  .details-body > .range-field:not(:last-child) {
    margin-bottom: 8px;
  }

  .hint-text {
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .range-field label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
    color: var(--ink-muted);
  }

  .range-field input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--text-strong);
    cursor: pointer;
    white-space: nowrap;
  }

  .radio-group input {
    cursor: pointer;
  }

  .field {
    margin-bottom: 10px;
  }

  .field label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--ink-muted);
  }

  .row-2 {
    display: flex;
    gap: 8px;
  }

  .row-2 .field,
  .row-2 .range-field {
    flex: 1;
    min-width: 0;
  }

  input[type="time"],
  input[type="date"],
  input[type="text"],
  select {

    padding: 8px 10px;
    border: 1px solid var(--border-input);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--input-bg);
    color: var(--text-strong);
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  input[type="time"]:focus,
  input[type="date"]:focus,
  input[type="text"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--event-current-shadow);
  }

  .list-panel-header {
    margin-bottom: 10px;
  }

  .list-panel-header h2 {
    margin-bottom: 8px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-nav input[type="date"] {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    font-size: 12px;
  }

  .btn-outline-sm {
    flex: 0 0 auto;
    padding: 6px 10px;
    border: 1px solid var(--border-input);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text-strong);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
  }

  .btn-outline-sm:hover {
    border-color: var(--accent);
  }

  .btn-outline-sm:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .date-nav-today-btn.is-today {
    display: none;
  }

  .import-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .import-row input[type="date"] {
    flex: 1;
    min-width: 0;
  }

  #event-form-fieldset {
    border: none;
    padding: 0;
    margin: 0;
    min-width: 0;
  }

  #event-form-fieldset:disabled .swatch {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .past-date-notice {
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
    background: var(--input-bg);
    border: 1px solid var(--border-input);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.2s var(--ease), border-color 0.2s var(--ease);
  }

  .swatch.selected {
    border-color: var(--ink-muted);
    transform: scale(1.1);
  }

  .swatch-custom {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border-faint);
    padding: 0;
    background: none;
    cursor: pointer;
    overflow: hidden;
  }

  .swatch-custom input[type="color"] {
    width: 40px;
    height: 40px;
    margin: -6px;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .btn-add {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 980px;
    background: var(--accent-bg);
    color: #1d1d1f;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    margin-top: 4px;
    box-shadow: 0 4px 14px var(--shadow-btn);
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  }

  .btn-add:hover {
    background: var(--accent-bg-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--shadow-btn);
  }

  .btn-add:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 2px 6px var(--shadow-btn);
  }

  .error-msg {
    color: var(--error);
    font-size: 14px;
    margin-top: 8px;
    min-height: 0;
  }

  .event-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .event-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--event-item-bg);
    border: 1px solid var(--event-item-border);
    border-radius: 14px;
    padding: 10px 12px;
    transition: opacity 0.2s var(--ease), background 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .event-row-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .event-row-bottom {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 23px;
  }

  .event-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--shadow-soft);
  }

  .event-item.event-past {
    opacity: 0.5;
  }

  .event-item.event-past .event-title,
  .event-item.event-past .event-time {
    text-decoration: line-through;
  }

  .event-item.event-completed {
    opacity: 0.5;
  }

  .event-item.event-completed .event-title,
  .event-item.event-completed .event-time {
    text-decoration: line-through;
  }

  .event-complete-checkbox {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .event-item.event-current {
    background: var(--event-current-bg);
    border-color: var(--event-current-border);
    box-shadow: 0 0 0 2px var(--event-current-shadow);
  }

  .event-color-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid var(--dot-border);
  }

  .event-time {
    font-size: 14px;
    color: var(--ink-muted);
    font-weight: 700;
    white-space: nowrap;
  }

  .event-title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .event-delete {
    border: none;
    background: none;
    color: var(--error);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }

  .event-empty {
    font-size: 14px;
    color: var(--ink-faint);
    padding: 6px 2px;
  }

  .event-alarm-flag {
    font-size: 13px;
    color: var(--alarm-color);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-strong);
    margin: 0;
    cursor: pointer;
  }

  .checkbox-label input {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  #alarm-trigger-point {
    padding: 6px 8px;
    border: 1px solid var(--border-faint);
    border-radius: 8px;
    font-size: 13px;
    background: var(--input-bg);
    color: var(--text-strong);
  }

  #alarm-trigger-point:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 300px;
  }

  .toast {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 12px 16px;
    box-shadow: 0 8px 24px var(--shadow-toast);
    animation: heroFadeIn 0.35s var(--ease) both;
  }

  .toast strong {
    display: block;
    font-size: 16px;
    margin-bottom: 4px;
    color: var(--ink);
  }

  .toast div {
    font-size: 14px;
    color: var(--ink-muted);
  }

  .event-band {
    cursor: pointer;
  }

  .event-band:hover {
    filter: brightness(0.93);
  }

  .alarm-marker {
    cursor: pointer;
  }

    fill: var(--clock-face-fill);
    stroke: var(--clock-face-stroke);
    cursor: crosshair;
    touch-action: none;
  }

  .drag-preview-band {
    pointer-events: none;
  }

  .draft-delete {
    cursor: pointer;
  }

  function pad2(n) {

  function pointOnCircle(cx, cy, r, clockDeg) {
    var rad = (clockDeg * Math.PI) / 180;
    return {
      x: cx + r * Math.sin(rad),
      y: cy - r * Math.cos(rad)
    };
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var key in attrs) {
      el.setAttribute(key, attrs[key]);
    }
    return el;
  }

  function timeToDeg(hhmm) {
    var parts = hhmm.split(":");
    var hh = parseInt(parts[0], 10);
    var mm = parseInt(parts[1], 10);
    return (hh * 60 + mm) * 0.25;
  }

  function angleFromCenter(svgPoint) {
    var dx = svgPoint.x - CX;
    var dy = svgPoint.y - CY;
    var rad = Math.atan2(dx, -dy);
    var deg = (rad * 180) / Math.PI;
    return (deg + 360) % 360;
  }

  function degToTimeStr(deg, snapMinutes) {
    var minutes = deg * 4;
    minutes = Math.round(minutes / snapMinutes) * snapMinutes;
    minutes = ((minutes % 1440) + 1440) % 1440;
    var hh = Math.floor(minutes / 60);
    var mm = minutes % 60;
    return pad2(hh) + ":" + pad2(mm);
  }

  function describeArcBand(cx, cy, startDeg, endDeg, outerR, innerR) {
    var diff = endDeg - startDeg;
    var largeArc = diff > 180 ? 1 : 0;
    var outerStart = pointOnCircle(cx, cy, outerR, startDeg);
    var outerEnd = pointOnCircle(cx, cy, outerR, endDeg);
    var innerStart = pointOnCircle(cx, cy, innerR, startDeg);
    var innerEnd = pointOnCircle(cx, cy, innerR, endDeg);

    return [
      "M", outerStart.x, outerStart.y,
      "A", outerR, outerR, 0, largeArc, 1, outerEnd.x, outerEnd.y,
      "L", innerEnd.x, innerEnd.y,
      "A", innerR, innerR, 0, largeArc, 0, innerStart.x, innerStart.y,
      "Z"
    ].join(" ");
  }

  function buildTicksAndLabels() {
    var majorGroup = document.getElementById("ticks-major");
    var minorGroup = document.getElementById("ticks-minor");
    var labelGroup = document.getElementById("tick-labels");
    majorGroup.innerHTML = "";
    minorGroup.innerHTML = "";
    labelGroup.innerHTML = "";

    for (var hour = 0; hour < 24; hour++) {
      var majorDeg = hour * 15;
      var outer = pointOnCircle(CX, CY, RADIUS_MAJOR_OUTER, majorDeg);
      var inner = pointOnCircle(CX, CY, RADIUS_MAJOR_INNER, majorDeg);
      majorGroup.appendChild(svgEl("line", {
        x1: outer.x, y1: outer.y, x2: inner.x, y2: inner.y,
        class: "tick-major"
      }));

      if (hour % 6 === 0) {
        var labelPos = pointOnCircle(CX, CY, RADIUS_LABEL, majorDeg);
        var text = svgEl("text", {
          x: labelPos.x, y: labelPos.y,
          class: "tick-label"
        });
        text.textContent = String(hour);
        labelGroup.appendChild(text);
      }

      for (var min = 10; min < 60; min += 10) {
        var minorDeg = majorDeg + min * 0.25;
        var mOuter = pointOnCircle(CX, CY, RADIUS_MINOR_OUTER, minorDeg);
        var mInner = pointOnCircle(CX, CY, RADIUS_MINOR_INNER, minorDeg);
        minorGroup.appendChild(svgEl("line", {
          x1: mOuter.x, y1: mOuter.y, x2: mInner.x, y2: mInner.y,
          class: "tick-minor"
        }));
      }
    }
  }

  function showSvgTooltip(pointerEvent, text) {

    tooltip.textContent = text;
    tooltip.style.display = "block";
    tooltip.style.left = (point.clientX + 12) + "px";
    tooltip.style.top = (point.clientY + 12) + "px";

    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(function () {
      tooltip.style.display = "none";
    }, 2500);
  }

        if (typeof parsed.titleByLang.en === "string") {

      } else if (typeof parsed.title === "string") {

      }
      if (typeof parsed.font === "string") {

  function renderHandShape() {
    var group = document.getElementById("hand");
    group.innerHTML = "";

    var length = currentHandLength;
    var thickness = handSettings.thickness;
    var tipY = CY - length;

    function addShaft(toY) {
      group.appendChild(svgEl("line", {
        x1: CX, y1: CY, x2: CX, y2: toY,
        "stroke-width": thickness,
        "stroke-linecap": "round"
      }));
    }

    if (handSettings.shape === "arrow") {
      var headLen = Math.min(length * 0.5, Math.max(14, thickness * 4));
      var headW = thickness * 2.4;
      var baseY = tipY + headLen;
      addShaft(baseY + 1);
      group.appendChild(svgEl("polygon", {
        points: CX + "," + tipY + " " + (CX - headW / 2) + "," + baseY + " " + (CX + headW / 2) + "," + baseY,
        stroke: "none"
      }));
    } else if (handSettings.shape === "diamond") {
      var dLen = Math.min(length * 0.5, Math.max(16, thickness * 4.5));
      var dW = thickness * 2.2;
      var dBaseY = tipY + dLen;
      var dMidY = tipY + dLen / 2;
      addShaft(dBaseY + 1);
      group.appendChild(svgEl("polygon", {
        points: CX + "," + tipY + " " + (CX + dW / 2) + "," + dMidY + " " + CX + "," + dBaseY + " " + (CX - dW / 2) + "," + dMidY,
        stroke: "none"
      }));
    } else if (handSettings.shape === "taper") {
      var baseW = thickness * 2.4;
      group.appendChild(svgEl("polygon", {
        points: (CX - baseW / 2) + "," + CY + " " + (CX + baseW / 2) + "," + CY + " " + CX + "," + tipY,
        stroke: "none"
      }));
    } else {
      addShaft(tipY);
    }
  }

  function adjustClockSpacing() {
    var svg = document.getElementById("clock-svg");
    var faceCircle = document.getElementById("clock-face-circle");
    var viewBox = svg.viewBox.baseVal;
    var r = parseFloat(faceCircle.getAttribute("r"));
    var cy = parseFloat(faceCircle.getAttribute("cy"));
    var emptyFraction = (cy - r - viewBox.y) / viewBox.height;
    var renderedHeight = svg.getBoundingClientRect().height;
    var gapPx = 10;

    svg.style.marginTop = Math.round(gapPx - emptyFraction * renderedHeight) + "px";
  }

  function applyClockStyle(key) {
    var preset = CLOCK_STYLES[key] ? CLOCK_STYLES[key] : CLOCK_STYLES.donut;
    currentClockStyleKey = CLOCK_STYLES[key] ? key : "donut";

    var defaultThickness = preset.bandOuter - preset.bandInner;
    if (typeof clockThickness[currentClockStyleKey] !== "number") {
      clockThickness[currentClockStyleKey] = defaultThickness;
    }
    var thickness = Math.min(preset.bandOuter, Math.max(4, clockThickness[currentClockStyleKey]));
    var effectiveBandInner = Math.max(0, preset.bandOuter - thickness);

    RADIUS_MAJOR_OUTER = preset.tickMajorOuter;
    RADIUS_MAJOR_INNER = preset.tickMajorInner;
    RADIUS_MINOR_OUTER = preset.tickMinorOuter;
    RADIUS_MINOR_INNER = preset.tickMinorInner;
    RADIUS_LABEL = preset.hourLabelR;
    BAND_OUTER_R = preset.bandOuter;
    BAND_INNER_R = effectiveBandInner;
    LABEL_RADIUS = thickness < 40 ? preset.bandOuter + 10 : (BAND_OUTER_R + BAND_INNER_R) / 2;
    MARKER_RADIUS = LABEL_RADIUS + 20;
    LABEL_MAX_LINES_OVERRIDE = preset.maxLinesOverride || null;

    document.getElementById("clock-face-circle").setAttribute("r", preset.faceR);
    currentHandLength = preset.handLen;
    renderHandShape();

    var thicknessInput = document.getElementById("band-thickness");
    var thicknessValue = document.getElementById("band-thickness-value");
    if (thicknessInput) {
      thicknessInput.max = preset.bandOuter;
      thicknessInput.value = thickness;
      thicknessValue.textContent = Math.round(thickness) + "px";
    }

    buildTicksAndLabels();
    refreshAll();
    adjustClockSpacing();
  }

  function wrapLabelLines(title, angleSpanDeg, fontSize) {
    var arcLen = (angleSpanDeg * Math.PI / 180) * LABEL_RADIUS;
    var charWidth = fontSize * 0.85;
    var maxChars = Math.max(2, Math.floor(arcLen / charWidth));
    var bandWidth = BAND_OUTER_R - BAND_INNER_R;
    var lineHeight = fontSize * 1.15;
    var maxLines = LABEL_MAX_LINES_OVERRIDE || Math.min(4, Math.max(1, Math.floor(bandWidth / lineHeight)));

    var words = title.split(/\s+/);
    var lines = [];
    var current = "";

    words.forEach(function (word) {
      var candidate = current ? current + " " + word : word;
      if (candidate.length > maxChars && current) {
        lines.push(current);
        current = word;
      } else {
        current = candidate;
      }
    });
    if (current) {
      lines.push(current);
    }

    if (lines.length > maxLines) {
      lines = lines.slice(0, maxLines);
      var last = lines[maxLines - 1];
      lines[maxLines - 1] = last.length > 1 ? last.slice(0, Math.max(1, maxChars - 1)) + "…" : last;
    }

    return lines;
  }

  function attachRotateDrag(handleCircle, handleIcon, textEl, evt, pos, baseRotation) {
    var svg = document.getElementById("clock-svg");
    var pt = svg.createSVGPoint();
    var dragging = false;
    var startPointerAngle = 0;
    var startLabelRotation = 0;

    function toSvgPoint(clientX, clientY) {
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function angleFromPos(svgP) {
      return Math.atan2(svgP.y - pos.y, svgP.x - pos.x) * 180 / Math.PI;
    }

    function applyRotation(rotation) {
      var transform = "rotate(" + rotation + " " + pos.x + " " + pos.y + ")";
      textEl.setAttribute("transform", transform);
      handleCircle.setAttribute("transform", transform);
      handleIcon.setAttribute("transform", transform);
    }

    handleCircle.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      handleCircle.classList.add("active");
      startPointerAngle = angleFromPos(toSvgPoint(e.clientX, e.clientY));
      startLabelRotation = evt.labelRotation || 0;
      handleCircle.setPointerCapture(e.pointerId);
    });

    handleCircle.addEventListener("pointermove", function (e) {
      if (!dragging) {
        return;
      }
      var currentAngle = angleFromPos(toSvgPoint(e.clientX, e.clientY));
      var delta = currentAngle - startPointerAngle;
      while (delta > 180) { delta -= 360; }
      while (delta < -180) { delta += 360; }
      evt.labelRotation = startLabelRotation + delta;
      applyRotation(baseRotation + evt.labelRotation);
    });

    function endDrag(e) {
      if (!dragging) {
        return;
      }
      dragging = false;
      handleCircle.classList.remove("active");
      try {
        handleCircle.releasePointerCapture(e.pointerId);
      } catch (err) {
        // pointer capture already released
      }
      saveEvents();
    }

    handleCircle.addEventListener("pointerup", endDrag);
    handleCircle.addEventListener("pointercancel", endDrag);

    handleCircle.addEventListener("dblclick", function (e) {
      e.preventDefault();
      e.stopPropagation();
      evt.labelRotation = 0;
      applyRotation(baseRotation);
      saveEvents();
    });
  }

  function attachResizeDrag(handleCircle, textEl, evt) {
    var svg = document.getElementById("clock-svg");
    var pt = svg.createSVGPoint();
    var dragging = false;
    var startDist = 0;
    var startFontSize = 0;

    function toSvgPoint(clientX, clientY) {
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function distFromCenter(svgP) {
      return Math.hypot(svgP.x - CX, svgP.y - CY);
    }

    handleCircle.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      handleCircle.classList.add("active");
      startDist = distFromCenter(toSvgPoint(e.clientX, e.clientY));
      startFontSize = evt.labelFontSize || labelSettings.fontSize;
      handleCircle.setPointerCapture(e.pointerId);
    });

    handleCircle.addEventListener("pointermove", function (e) {
      if (!dragging) {
        return;
      }
      var currentDist = distFromCenter(toSvgPoint(e.clientX, e.clientY));
      var delta = (currentDist - startDist) * FONT_SIZE_DRAG_SENSITIVITY;
      var newSize = Math.min(MAX_LABEL_FONT_SIZE, Math.max(MIN_LABEL_FONT_SIZE, startFontSize + delta));
      evt.labelFontSize = newSize;
      textEl.setAttribute("font-size", newSize);
    });

    function endDrag(e) {
      if (!dragging) {
        return;
      }
      dragging = false;
      handleCircle.classList.remove("active");
      try {
        handleCircle.releasePointerCapture(e.pointerId);
      } catch (err) {
        // pointer capture already released
      }
      evt.labelFontSize = Math.round(evt.labelFontSize);
      saveEvents();
      renderEventBands();
    }

    handleCircle.addEventListener("pointerup", endDrag);
    handleCircle.addEventListener("pointercancel", endDrag);

    handleCircle.addEventListener("dblclick", function (e) {
      e.preventDefault();
      e.stopPropagation();
      evt.labelFontSize = null;
      saveEvents();
      renderEventBands();
    });
  }

  function attachLabelMoveDrag(text, labelGroup, evt) {
    var svg = document.getElementById("clock-svg");
    var pt = svg.createSVGPoint();
    var dragging = false;
    var moved = false;
    var startSvgX = 0, startSvgY = 0;
    var startOffsetX = 0, startOffsetY = 0;

    function toSvgPoint(clientX, clientY) {
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function applyOffset(x, y) {
      labelGroup.setAttribute("transform", "translate(" + x + " " + y + ")");
    }

    text.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      moved = false;
      text.classList.add("dragging");
      var svgP = toSvgPoint(e.clientX, e.clientY);
      startSvgX = svgP.x;
      startSvgY = svgP.y;
      startOffsetX = evt.labelOffsetX || 0;
      startOffsetY = evt.labelOffsetY || 0;
      text.setPointerCapture(e.pointerId);
    });

    text.addEventListener("pointermove", function (e) {
      if (!dragging) {
        return;
      }
      var svgP = toSvgPoint(e.clientX, e.clientY);
      var dx = svgP.x - startSvgX;
      var dy = svgP.y - startSvgY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        moved = true;
      }
      evt.labelOffsetX = startOffsetX + dx;
      evt.labelOffsetY = startOffsetY + dy;
      applyOffset(evt.labelOffsetX, evt.labelOffsetY);
    });

    function endDrag(e) {
      if (!dragging) {
        return;
      }
      dragging = false;
      text.classList.remove("dragging");
      try {
        text.releasePointerCapture(e.pointerId);
      } catch (err) {
        // pointer capture already released
      }
      if (!moved) {
        showSvgTooltip(e, evt.title + " (" + evt.startTime + " - " + evt.endTime + ")");
      }
      saveEvents();
    }

    text.addEventListener("pointerup", endDrag);
    text.addEventListener("pointercancel", endDrag);

    text.addEventListener("dblclick", function (e) {
      e.preventDefault();
      e.stopPropagation();
      evt.labelOffsetX = 0;
      evt.labelOffsetY = 0;
      applyOffset(0, 0);
      saveEvents();
    });
  }

  function buildEventLabelAndHandle(evt, startDeg, endDeg) {
    var midDeg = (startDeg + endDeg) / 2;
    var pos = pointOnCircle(CX, CY, LABEL_RADIUS, midDeg);
    var normalizedMid = ((midDeg % 360) + 360) % 360;
    var baseRotation = normalizedMid <= 180 ? normalizedMid - 90 : normalizedMid + 90;
    var labelRotation = evt.labelRotation || 0;
    var finalRotation = baseRotation + labelRotation;

    var fontSize = evt.labelFontSize || labelSettings.fontSize;
    var lines = wrapLabelLines(evt.title, endDeg - startDeg, fontSize);
    var transform = "rotate(" + finalRotation + " " + pos.x + " " + pos.y + ")";

    var group = svgEl("g", { class: "event-label-group" });

    var text = svgEl("text", {
      x: pos.x, y: pos.y,
      class: "event-label",
      "font-size": fontSize,
      transform: transform
    });

    var startDy = -((lines.length - 1) / 2) * fontSize * 1.15;
    lines.forEach(function (line, i) {
      var tspan = svgEl("tspan", {
        x: pos.x,
        dy: i === 0 ? startDy : fontSize * 1.15
      });
      tspan.textContent = line;
      text.appendChild(tspan);
    });

    var handleOffset = fontSize * 1.6 + 14;
    var handleCircle = svgEl("circle", {
      cx: pos.x + handleOffset, cy: pos.y,
      r: HANDLE_RADIUS,
      class: "rotate-handle-bg",
      transform: transform
    });
    var handleIcon = svgEl("text", {
      x: pos.x + handleOffset, y: pos.y,
      class: "rotate-handle-icon",
      transform: transform
    });
    handleIcon.textContent = "↻";

    var resizeCircle = svgEl("circle", {
      cx: pos.x - handleOffset, cy: pos.y,
      r: HANDLE_RADIUS,
      class: "resize-handle-bg",
      transform: transform
    });
    var resizeIcon = svgEl("text", {
      x: pos.x - handleOffset, y: pos.y,
      class: "resize-handle-icon",
      transform: transform
    });
    resizeIcon.textContent = "↕";

    group.appendChild(text);
    group.appendChild(handleCircle);
    group.appendChild(handleIcon);
    group.appendChild(resizeCircle);
    group.appendChild(resizeIcon);

    if (!isPastViewingDate()) {
      var deleteCircle = svgEl("circle", {
        cx: pos.x, cy: pos.y - handleOffset,
        r: HANDLE_RADIUS,
        class: "delete-handle-bg",
        transform: transform
      });
      var deleteIcon = svgEl("text", {
        x: pos.x, y: pos.y - handleOffset,
        class: "delete-handle-icon",
        transform: transform
      });
      deleteIcon.textContent = "×";

      group.appendChild(deleteCircle);
      group.appendChild(deleteIcon);

      deleteCircle.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
      });
      deleteCircle.addEventListener("click", function (e) {
        e.stopPropagation();
        events = events.filter(function (other) { return other.id !== evt.id; });
        saveEvents();
        refreshAll();
      });
    }

    var offsetX = evt.labelOffsetX || 0;
    var offsetY = evt.labelOffsetY || 0;
    group.setAttribute("transform", "translate(" + offsetX + " " + offsetY + ")");

    attachRotateDrag(handleCircle, handleIcon, text, evt, pos, baseRotation);
    attachResizeDrag(resizeCircle, text, evt);
    attachLabelMoveDrag(text, group, evt);

    return group;
  }

  function clearDragDraft() {
    document.getElementById("drag-preview").innerHTML = "";
  }

  function initClockFaceDragCreate() {
    var svg = document.getElementById("clock-svg");
    var circle = document.getElementById("clock-face-circle");
    var previewGroup = document.getElementById("drag-preview");
    var pt = svg.createSVGPoint();
    var dragging = false;
    var startDeg = 0;

    function toSvgPoint(clientX, clientY) {
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function drawLiveBand(deg1, deg2) {
      previewGroup.innerHTML = "";
      if (deg1 === deg2) {
        return;
      }
      var d = describeArcBand(CX, CY, deg1, deg2, BAND_OUTER_R, BAND_INNER_R);
      previewGroup.appendChild(svgEl("path", {
        d: d,
        class: "drag-preview-band",
        fill: selectedColor,
        "fill-opacity": "0.55",
        stroke: "rgba(0,0,0,0.35)",
        "stroke-width": "1.5",
        "stroke-dasharray": "5 4"
      }));
    }

    function drawDraft(startTime, endTime) {
      previewGroup.innerHTML = "";
      var deg1 = timeToDeg(startTime);
      var deg2 = timeToDeg(endTime);
      var d = describeArcBand(CX, CY, deg1, deg2, BAND_OUTER_R, BAND_INNER_R);
      previewGroup.appendChild(svgEl("path", {
        d: d,
        class: "drag-preview-band",
        fill: selectedColor,
        "fill-opacity": "0.55",
        stroke: "rgba(0,0,0,0.35)",
        "stroke-width": "1.5",
        "stroke-dasharray": "5 4"
      }));

      var midDeg = (deg1 + deg2) / 2;
      var pos = pointOnCircle(CX, CY, BAND_OUTER_R + 14, midDeg);
      var deleteGroup = svgEl("g", { class: "draft-delete" });
      var deleteBg = svgEl("circle", {
        cx: pos.x, cy: pos.y,
        r: HANDLE_RADIUS,
        class: "draft-delete-bg"
      });
      var deleteIcon = svgEl("text", {
        x: pos.x, y: pos.y,
        class: "draft-delete-icon"
      });
      deleteIcon.textContent = "×";

      deleteGroup.appendChild(deleteBg);
      deleteGroup.appendChild(deleteIcon);
      deleteGroup.addEventListener("click", function (e) {
        e.stopPropagation();
        clearDragDraft();
        document.getElementById("start-time").value = "";
        document.getElementById("end-time").value = "";
      });

      previewGroup.appendChild(deleteGroup);
    }

    circle.addEventListener("pointerdown", function (e) {
      if (isPastViewingDate()) {
        return;
      }
      e.preventDefault();
      clearDragDraft();
      dragging = true;
      startDeg = angleFromCenter(toSvgPoint(e.clientX, e.clientY));
      circle.setPointerCapture(e.pointerId);
    });

    circle.addEventListener("pointermove", function (e) {
      if (!dragging) {
        return;
      }
      var currentDeg = angleFromCenter(toSvgPoint(e.clientX, e.clientY));
      drawLiveBand(Math.min(startDeg, currentDeg), Math.max(startDeg, currentDeg));
    });

    function endDrag(e) {
      if (!dragging) {
        return;
      }
      dragging = false;
      try {
        circle.releasePointerCapture(e.pointerId);
      } catch (err) {
        // pointer capture already released
      }

      var endDeg = angleFromCenter(toSvgPoint(e.clientX, e.clientY));
      var deg1 = Math.min(startDeg, endDeg);
      var deg2 = Math.max(startDeg, endDeg);
      var startTime = degToTimeStr(deg1, DRAG_CREATE_SNAP_MINUTES);
      var endTime = degToTimeStr(deg2, DRAG_CREATE_SNAP_MINUTES);

      if (startTime === endTime) {
        clearDragDraft();
        return;
      }

      drawDraft(startTime, endTime);
      document.getElementById("start-time").value = startTime;
      document.getElementById("end-time").value = endTime;
      document.getElementById("task-title").focus();
    }

    circle.addEventListener("pointerup", endDrag);
    circle.addEventListener("pointercancel", endDrag);
  }

  function renderEventBands() {
    var group = document.getElementById("event-bands");
    group.innerHTML = "";

    events.forEach(function (evt) {
      var startDeg = timeToDeg(evt.startTime);
      var endDeg = timeToDeg(evt.endTime);

        class: "event-band"
      });

      var titleEl = document.createElementNS(SVG_NS, "title");
      titleEl.textContent = tooltipText;
      path.appendChild(titleEl);

      path.addEventListener("click", function (e) {
        showSvgTooltip(e, tooltipText);
      });

      var evtGroup = svgEl("g", { class: "event-group" });

  function renderAlarmMarkers() {
    var group = document.getElementById("alarm-markers");
    group.innerHTML = "";

    events.forEach(function (evt) {
      if (!evt.alarmEnabled) {
        return;
      }
      var triggerTime = evt.alarmTriggerPoint === "end" ? evt.endTime : evt.startTime;
      var deg = timeToDeg(triggerTime);
      var pos = pointOnCircle(CX, CY, MARKER_RADIUS, deg);
      var tooltipText = evt.title + " 알람 (" + triggerTime + ")";
      var size = 18;

      var marker = svgEl("use", {
        href: "#star-icon",
        x: pos.x - size / 2,
        y: pos.y - size / 2,
        width: size,
        height: size,
        class: "alarm-marker"
      });
      marker.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#star-icon");

      var titleEl = document.createElementNS(SVG_NS, "title");
      titleEl.textContent = tooltipText;
      marker.appendChild(titleEl);

      marker.addEventListener("click", function (e) {
        showSvgTooltip(e, tooltipText);
      });

      group.appendChild(marker);

  function refreshAll() {
    renderEventList();
    renderEventBands();
    renderAlarmMarkers();
  }

  function updateClockHand() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();
    var totalSeconds = h * 3600 + m * 60 + s;
    var deg = (totalSeconds / 86400) * 360;

    document.getElementById("hand").style.transform = "rotate(" + deg + "deg)";
    document.getElementById("time-text-display").textContent =
      pad2(h) + ":" + pad2(m) + ":" + pad2(s);

    refreshEventStatuses();
    checkDateRollover();
  }

  function refreshEventStatuses() {
    var isToday = viewingDateStr === todayDateStr();
    var isPastDay = !isToday && viewingDateStr < todayDateStr();
    var now = new Date();
    var nowHM = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    var items = document.querySelectorAll("#event-list .event-item");

    for (var i = 0; i < items.length; i++) {
      var li = items[i];
      var start = li.getAttribute("data-start");
      var end = li.getAttribute("data-end");
      if (!start || !end) {
        continue;
      }
      li.classList.remove("event-past", "event-current");
      if (isPastDay) {
        li.classList.add("event-past");
      } else if (isToday) {
        if (end <= nowHM) {
          li.classList.add("event-past");
        } else if (start <= nowHM && nowHM < end) {
          li.classList.add("event-current");
        }
      }
    }
  }

  function checkDateRollover() {
    var d = todayDateStr();
    if (d !== currentDateStr) {
      var wasFollowingToday = (viewingDateStr === currentDateStr);
      currentDateStr = d;
      if (wasFollowingToday) {
        setViewingDate(d);
      }
    }
  }

  function todayDateStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function isPastViewingDate() {
    return viewingDateStr < todayDateStr();
  }

  function storageKey() {
    return "roundClock_events_" + viewingDateStr;
  }

  function loadEvents() {
    var raw = localStorage.getItem(storageKey());
    if (!raw) {
      events = [];
      return;
    }
    try {
      var parsed = JSON.parse(raw);
      events = Array.isArray(parsed.events) ? parsed.events : [];
    } catch (e) {
      events = [];
    }
  }

  function saveEvents() {
    var payload = {
      date: viewingDateStr,
      events: events
    };
    localStorage.setItem(storageKey(), JSON.stringify(payload));
  }

  function setViewingDate(dateStr) {
    viewingDateStr = dateStr;
    var input = document.getElementById("view-date-input");
    if (input) {
      input.value = dateStr;
    }
    var todayBtn = document.getElementById("date-today-btn");
    if (todayBtn) {
      todayBtn.classList.toggle("is-today", dateStr === todayDateStr());
    }
    updatePastDateLock();
    loadEvents();
    refreshAll();
  }

  function updatePastDateLock() {
    var isPast = isPastViewingDate();
    var fieldset = document.getElementById("event-form-fieldset");
    var notice = document.getElementById("past-date-notice");
    var importInput = document.getElementById("import-date-input");
    var importBtn = document.getElementById("import-date-btn");
    if (fieldset) {
      fieldset.disabled = isPast;
    }
    if (notice) {
      notice.hidden = !isPast;
    }
    if (importInput) {
      importInput.disabled = isPast;
    }
    if (importBtn) {
      importBtn.disabled = isPast;
    }
  }

  function initDateNav() {
    var input = document.getElementById("view-date-input");
    var todayBtn = document.getElementById("date-today-btn");

    input.value = viewingDateStr;
    todayBtn.classList.toggle("is-today", viewingDateStr === todayDateStr());
    updatePastDateLock();

    input.addEventListener("change", function (e) {
      if (!e.target.value) {
        return;
      }
      setViewingDate(e.target.value);
    });

    todayBtn.addEventListener("click", function () {
      setViewingDate(todayDateStr());
    });
  }

  function initImportDate() {
    var importInput = document.getElementById("import-date-input");
    var importBtn = document.getElementById("import-date-btn");

    importBtn.addEventListener("click", function () {
      var sourceDate = importInput.value;
      if (!sourceDate) {
        showError(t("app.importNeedDate"));
        return;
      }
      if (sourceDate === viewingDateStr) {
        showError(t("app.importSameDate"));
        return;
      }

      var raw = localStorage.getItem("roundClock_events_" + sourceDate);
      var sourceEvents = [];
      if (raw) {
        try {
          var parsed = JSON.parse(raw);
          sourceEvents = Array.isArray(parsed.events) ? parsed.events : [];
        } catch (e) {
          sourceEvents = [];
        }
      }
      if (sourceEvents.length === 0) {
        showError(t("app.importEmpty"));
        return;
      }

      sourceEvents.forEach(function (evt) {
        events.push({
          id: genId(),
          startTime: evt.startTime,
          endTime: evt.endTime,
          title: evt.title,
          color: evt.color,
          alarmEnabled: !!evt.alarmEnabled,
          alarmTriggerPoint: evt.alarmTriggerPoint || "start",
          alarmFiredToday: false,
          completed: false,
          labelRotation: 0,
          labelFontSize: null,
          labelOffsetX: 0,
          labelOffsetY: 0
        });
      });

      saveEvents();
      refreshAll();
      showError("");
      importInput.value = "";
    });
  }

  function genId() {
    return "evt_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
  }

  function renderSwatches() {
    var container = document.getElementById("swatches");
    container.innerHTML = "";

    PASTEL_COLORS.forEach(function (color) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swatch" + (color === selectedColor ? " selected" : "");
      btn.style.background = color;
      btn.setAttribute("aria-label", color);
      btn.addEventListener("click", function () {
        selectedColor = color;
        renderSwatches();
      });
      container.appendChild(btn);
    });

    var customWrap = document.createElement("label");
    customWrap.className = "swatch-custom";
    customWrap.title = t("app.customColorTitle");
    var customInput = document.createElement("input");
    customInput.type = "color";
    customInput.value = selectedColor.length === 7 ? selectedColor : "#ffffff";
    customInput.addEventListener("input", function (e) {
      selectedColor = e.target.value;
      renderSwatches();
    });
    customWrap.appendChild(customInput);
    container.appendChild(customWrap);
  }

  function renderEventList() {
    var list = document.getElementById("event-list");
    list.innerHTML = "";

    if (events.length === 0) {
      var empty = document.createElement("li");
      empty.className = "event-empty";
      empty.textContent = t("app.emptyList");
      list.appendChild(empty);
      return;
    }

    var sorted = events.slice().sort(function (a, b) {
      return a.startTime.localeCompare(b.startTime);
    });

    var isToday = viewingDateStr === todayDateStr();
    var isPastDay = !isToday && viewingDateStr < todayDateStr();
    var nowHM = pad2(new Date().getHours()) + ":" + pad2(new Date().getMinutes());

    sorted.forEach(function (evt) {
      var li = document.createElement("li");
      li.className = "event-item";
      li.setAttribute("data-start", evt.startTime);
      li.setAttribute("data-end", evt.endTime);
      if (isPastDay) {
        li.classList.add("event-past");
      } else if (isToday) {
        if (evt.endTime <= nowHM) {
          li.classList.add("event-past");
        } else if (evt.startTime <= nowHM && nowHM < evt.endTime) {
          li.classList.add("event-current");
        }
      }
      if (evt.completed) {
        li.classList.add("event-completed");
      }

      var rowTop = document.createElement("div");
      rowTop.className = "event-row-top";
      var rowBottom = document.createElement("div");
      rowBottom.className = "event-row-bottom";

      var completeCheckbox = document.createElement("input");
      completeCheckbox.type = "checkbox";
      completeCheckbox.className = "event-complete-checkbox";
      completeCheckbox.checked = !!evt.completed;
      completeCheckbox.setAttribute("aria-label", t("app.completeAria"));
      completeCheckbox.addEventListener("change", function () {
        evt.completed = completeCheckbox.checked;
        li.classList.toggle("event-completed", evt.completed);
        saveEvents();
      });
      rowTop.appendChild(completeCheckbox);

      var title = document.createElement("span");
      title.className = "event-title";
      title.textContent = evt.title;
      rowTop.appendChild(title);

      if (!isPastDay) {
        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "event-delete";
        delBtn.textContent = t("app.deleteBtn");
        delBtn.addEventListener("click", function () {
          events = events.filter(function (e) { return e.id !== evt.id; });
          saveEvents();
          refreshAll();
        });
        rowTop.appendChild(delBtn);
      }

      var dot = document.createElement("span");
      dot.className = "event-color-dot";
      dot.style.background = evt.color;
      rowBottom.appendChild(dot);

      var time = document.createElement("span");
      time.className = "event-time";
      time.textContent = evt.startTime + " - " + evt.endTime;
      rowBottom.appendChild(time);

      if (evt.alarmEnabled) {
        var alarmFlag = document.createElement("span");
        alarmFlag.className = "event-alarm-flag";
        alarmFlag.textContent = "🔔 " + (evt.alarmTriggerPoint === "end" ? t("app.alarmFlagEnd") : t("app.alarmFlagStart"));
        rowBottom.appendChild(alarmFlag);
      }

      li.appendChild(rowTop);
      li.appendChild(rowBottom);
      list.appendChild(li);
    });
  }

  function showError(msg) {
    document.getElementById("error-msg").textContent = msg || "";
  }

  function handleFormSubmit(e) {
    e.preventDefault();

    if (isPastViewingDate()) {
      return;
    }

    var startTime = document.getElementById("start-time").value;
    var endTime = document.getElementById("end-time").value;
    var title = document.getElementById("task-title").value.trim();

    if (!startTime || !endTime) {
      showError(t("app.errorNeedTimes"));
      return;
    }
    if (!title) {
      showError(t("app.errorNeedTitle"));
      return;
    }
    if (startTime >= endTime) {
      showError(t("app.errorEndBeforeStart"));
      return;
    }

    showError("");

    var alarmEnabled = document.getElementById("alarm-enabled").checked;
    var alarmTriggerPoint = document.getElementById("alarm-trigger-point").value;

    events.push({
      id: genId(),
      startTime: startTime,
      endTime: endTime,
      title: title,
      color: selectedColor,
      alarmEnabled: alarmEnabled,
      alarmTriggerPoint: alarmTriggerPoint,
      alarmFiredToday: false,
      completed: false,
      labelRotation: 0,
      labelFontSize: null,
      labelOffsetX: 0,
      labelOffsetY: 0
    });

    saveEvents();
    refreshAll();
    clearDragDraft();

    document.getElementById("task-title").value = "";
    document.getElementById("alarm-enabled").checked = false;
    document.getElementById("alarm-trigger-point").disabled = true;
    document.getElementById("alarm-trigger-point").value = "start";
  }

  function playBeep() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var ctx = new AudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) {
      // Web Audio unavailable — ignore, visual alarm still shows
    }
  }

  function showToast(title, body, icon) {
    var container = document.getElementById("toast-container");
    var toast = document.createElement("div");
    toast.className = "toast";

    var strong = document.createElement("strong");
    strong.textContent = (icon || "🔔") + " " + title;
    var div = document.createElement("div");
    div.textContent = body;

    toast.appendChild(strong);
    toast.appendChild(div);
    container.appendChild(toast);

    setTimeout(function () {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 6000);
  }

  function exportFileBaseName() {
    var titleText = document.getElementById("title-text-display").textContent.trim();
    var safe = (titleText || "round-clock").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "-");
    return safe + "_" + todayDateStr();
  }

  function captureClockPanel() {
    var panel = document.querySelector(".clock-panel");
    var svg = document.getElementById("clock-svg");
    var titleEl = document.getElementById("live-time-title");
    var prevDisplay = titleEl.style.display;
    var scale = 2;

    titleEl.style.display = "none";

    return html2canvas(panel, {
      backgroundColor: null,
      scale: scale,
      useCORS: true,
      onclone: function (clonedDoc) {
        var handGroup = clonedDoc.getElementById("hand-group");
        if (handGroup) {
          handGroup.style.display = "none";
        }
      }
    }).then(
      function (fullCanvas) {
        var panelRect = panel.getBoundingClientRect();
        var svgRect = svg.getBoundingClientRect();
        titleEl.style.display = prevDisplay;

        var cropX = (svgRect.left - panelRect.left) * scale;
        var cropY = (svgRect.top - panelRect.top) * scale;
        var cropW = svgRect.width * scale;
        var cropH = svgRect.height * scale;

        var cropped = document.createElement("canvas");
        cropped.width = cropW;
        cropped.height = cropH;
        cropped.getContext("2d").drawImage(fullCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        return cropped;
      },
      function (err) {
        titleEl.style.display = prevDisplay;
        throw err;
      }
    );
  }

  function captureFullPanel() {
    var panel = document.querySelector(".clock-panel");
    return html2canvas(panel, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      onclone: function (clonedDoc) {
        var timeEl = clonedDoc.getElementById("time-text-display");
        if (timeEl) {
          timeEl.style.fontVariantNumeric = "normal";
        }
        var clonedSvg = clonedDoc.getElementById("clock-svg");
        if (clonedSvg) {
          clonedSvg.style.marginTop = "20px";
        }
        var handGroup = clonedDoc.getElementById("hand-group");
        if (handGroup) {
          handGroup.style.display = "none";
        }
      }
    });
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportImageFrom(captureFn, suffix) {
    if (typeof html2canvas === "undefined") {
      showToast(t("app.exportErrorTitle"), t("app.exportErrorToast"), "⚠️");
      return;
    }
    captureFn().then(function (canvas) {
      canvas.toBlob(function (blob) {
        downloadBlob(blob, exportFileBaseName() + suffix + ".png");
      }, "image/png");
    }).catch(function () {
      showToast(t("app.exportErrorTitle"), t("app.exportErrorToast"), "⚠️");
    });
  }

  function exportPdfFrom(captureFn, suffix) {
    if (typeof html2canvas === "undefined" || typeof window.jspdf === "undefined") {
      showToast(t("app.exportErrorTitle"), t("app.exportErrorToast"), "⚠️");
      return;
    }
    captureFn().then(function (canvas) {
      var jsPDF = window.jspdf.jsPDF;
      var orientation = canvas.width >= canvas.height ? "landscape" : "portrait";
      var pdf = new jsPDF({ orientation: orientation, unit: "px", format: [canvas.width, canvas.height] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width, canvas.height);
      pdf.save(exportFileBaseName() + suffix + ".pdf");
    }).catch(function () {
      showToast(t("app.exportErrorTitle"), t("app.exportErrorToast"), "⚠️");
    });
  }

  function exportAsImage() {
    exportImageFrom(captureClockPanel, "");
  }

  function exportAsPdf() {
    exportPdfFrom(captureClockPanel, "");
  }

  function exportAsImageFull() {
    exportImageFrom(captureFullPanel, "_full");
  }

  function exportAsPdfFull() {
    exportPdfFrom(captureFullPanel, "_full");
  }

  function buildStandaloneClockHtml() {
    var preset = CLOCK_STYLES[currentClockStyleKey] || CLOCK_STYLES.donut;
    var lang = window.RoundClockI18n ? window.RoundClockI18n.getLang() : "ko";
    var titleText = titleSettings.titleByLang[lang] || t("app.defaultTitle");
    var themeAttr = document.documentElement.getAttribute("data-theme") || "";

    var simplifiedEvents = events.map(function (evt) {
      return {
        startTime: evt.startTime,
        endTime: evt.endTime,
        title: evt.title,
        color: evt.color,
        alarmEnabled: !!evt.alarmEnabled,
        alarmTriggerPoint: evt.alarmTriggerPoint || "start"
      };
    });

    var data = {
      face: preset.faceR,
      bandOuter: BAND_OUTER_R,
      bandInner: BAND_INNER_R,
      tickMajorOuter: RADIUS_MAJOR_OUTER,
      tickMajorInner: RADIUS_MAJOR_INNER,
      tickMinorOuter: RADIUS_MINOR_OUTER,
      tickMinorInner: RADIUS_MINOR_INNER,
      hourLabelR: RADIUS_LABEL,
      markerR: MARKER_RADIUS,
      handLen: currentHandLength,
      handShape: handSettings.shape,
      handThickness: handSettings.thickness,
      title: titleText,
      font: titleSettings.font,
      titleFontSize: titleSettings.titleFontSize,
      timeFontSize: titleSettings.timeFontSize,
      theme: themeAttr,
      events: simplifiedEvents
    };

    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    var titleHtml = titleText.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    var lines = [
      "<!DOCTYPE html>",
      "<html lang=\"" + lang + "\"" + (themeAttr ? " data-theme=\"" + themeAttr + "\"" : "") + ">",
      "<head>",
      "<meta charset=\"UTF-8\">",
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
      "<title>" + titleHtml + "</title>",
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">",
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>",
      "<link href=\"https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Single+Day&family=Nanum+Brush+Script&family=Hi+Melody&family=Gowun+Dodum&family=Jua&family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap\" rel=\"stylesheet\">",
      "<style>",
      "  * { box-sizing: border-box; }",
      "  :root {",
      "    --bg: #f5f5f7; --ink: #1d1d1f; --ink-soft: #6e6e73;",
      "    --tick-major: #1d1d1f; --tick-minor: rgba(0,0,0,0.22); --tick-label: #1d1d1f;",
      "    --hand-color: #1d1d1f; --face-fill: #ffffff; --face-stroke: rgba(0,0,0,0.08); --alarm-color: #a9762e;",
      "  }",
      "  @media (prefers-color-scheme: dark) {",
      "    :root:not([data-theme=\"light\"]) {",
      "      --bg: #000000; --ink: #f5f5f7; --ink-soft: #98989d;",
      "      --tick-major: #f5f5f7; --tick-minor: rgba(255,255,255,0.25); --tick-label: #f5f5f7;",
      "      --hand-color: #f5f5f7; --face-fill: #1c1c1e; --face-stroke: rgba(255,255,255,0.1); --alarm-color: #e6bd6e;",
      "    }",
      "  }",
      "  :root[data-theme=\"dark\"] {",
      "    --bg: #000000; --ink: #f5f5f7; --ink-soft: #98989d;",
      "    --tick-major: #f5f5f7; --tick-minor: rgba(255,255,255,0.25); --tick-label: #f5f5f7;",
      "    --hand-color: #f5f5f7; --face-fill: #1c1c1e; --face-stroke: rgba(255,255,255,0.1); --alarm-color: #e6bd6e;",
      "  }",
      "  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif; }",
      "  .clock-wrap { text-align:center; padding:24px; }",
      "  .title-text { font-size:" + data.titleFontSize + "px; font-weight:600; color:var(--ink-soft); font-family:" + data.font + "; margin-bottom:4px; }",
      "  .time-text { font-size:" + data.timeFontSize + "px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; font-family:" + data.font + "; margin-bottom:10px; }",
      "  #clock-svg { width:100%; max-width:520px; height:auto; }",
      "  #face-circle { fill:var(--face-fill); stroke:var(--face-stroke); stroke-width:2; }",
      "  .tick-major { stroke:var(--tick-major); stroke-width:2.2; stroke-linecap:round; }",
      "  .tick-minor { stroke:var(--tick-minor); stroke-width:1.3; stroke-linecap:round; }",
      "  .tick-label { font-size:15px; font-weight:700; fill:var(--tick-label); text-anchor:middle; dominant-baseline:middle; }",
      "  #hand { stroke:var(--hand-color); fill:var(--hand-color); transform-origin:200px 200px; transition:transform 0.25s linear; }",
      "  .hand-center { fill:var(--hand-color); }",
      "</style>",
      "</head>",
      "<body>",
      "<div class=\"clock-wrap\">",
      "  <div class=\"title-text\" id=\"title-text\"></div>",
      "  <div class=\"time-text\" id=\"time-text\">00:00:00</div>",
      "  <svg id=\"clock-svg\" viewBox=\"-80 -80 560 560\">",
      "    <defs>",
      "      <symbol id=\"star-icon\" viewBox=\"0 0 20 20\">",
      "        <path d=\"M10 1.2 L12.35 7.2 L18.8 7.64 L13.85 11.76 L15.51 18 L10 14.4 L4.49 18 L6.15 11.76 L1.2 7.64 L7.65 7.2 Z\" fill=\"#f0ad4e\" stroke=\"#8a5a20\" stroke-width=\"0.8\" stroke-linejoin=\"round\"></path>",
      "      </symbol>",
      "    </defs>",
      "    <circle id=\"face-circle\" cx=\"200\" cy=\"200\" r=\"" + data.face + "\"></circle>",
      "    <g id=\"event-bands\"></g>",
      "    <g id=\"ticks-major\"></g>",
      "    <g id=\"ticks-minor\"></g>",
      "    <g id=\"tick-labels\"></g>",
      "    <g id=\"alarm-markers\"></g>",
      "    <g id=\"hand-group\">",
      "      <g id=\"hand\"></g>",
      "      <circle class=\"hand-center\" cx=\"200\" cy=\"200\" r=\"6\"></circle>",
      "    </g>",
      "  </svg>",
      "</div>",
      "<script>",
      "var DATA = " + json + ";",
      "var CX=200, CY=200, SVG_NS='http://www.w3.org/2000/svg';",
      "function pad2(n){ return n<10?'0'+n:''+n; }",
      "function pointOnCircle(cx,cy,r,deg){ var rad=deg*Math.PI/180; return {x:cx+r*Math.sin(rad), y:cy-r*Math.cos(rad)}; }",
      "function svgEl(tag,attrs){ var el=document.createElementNS(SVG_NS,tag); for(var k in attrs){ el.setAttribute(k,attrs[k]); } return el; }",
      "function timeToDeg(hhmm){ var p=hhmm.split(':'); return (parseInt(p[0],10)*60+parseInt(p[1],10))*0.25; }",
      "function describeArcBand(cx,cy,startDeg,endDeg,outerR,innerR){ var diff=endDeg-startDeg; var largeArc=diff>180?1:0; var os=pointOnCircle(cx,cy,outerR,startDeg), oe=pointOnCircle(cx,cy,outerR,endDeg), is_=pointOnCircle(cx,cy,innerR,startDeg), ie=pointOnCircle(cx,cy,innerR,endDeg); return ['M',os.x,os.y,'A',outerR,outerR,0,largeArc,1,oe.x,oe.y,'L',ie.x,ie.y,'A',innerR,innerR,0,largeArc,0,is_.x,is_.y,'Z'].join(' '); }",
      "function buildTicks(){ var maj=document.getElementById('ticks-major'), min=document.getElementById('ticks-minor'), lab=document.getElementById('tick-labels'); for(var h=0;h<24;h++){ var d=h*15; var o=pointOnCircle(CX,CY,DATA.tickMajorOuter,d), i=pointOnCircle(CX,CY,DATA.tickMajorInner,d); maj.appendChild(svgEl('line',{x1:o.x,y1:o.y,x2:i.x,y2:i.y,'class':'tick-major'})); if(h%6===0){ var lp=pointOnCircle(CX,CY,DATA.hourLabelR,d); var t=svgEl('text',{x:lp.x,y:lp.y,'class':'tick-label'}); t.textContent=String(h); lab.appendChild(t); } for(var m=10;m<60;m+=10){ var md=d+m*0.25; var mo=pointOnCircle(CX,CY,DATA.tickMinorOuter,md), mi=pointOnCircle(CX,CY,DATA.tickMinorInner,md); min.appendChild(svgEl('line',{x1:mo.x,y1:mo.y,x2:mi.x,y2:mi.y,'class':'tick-minor'})); } } }",
      "function renderBands(){ var g=document.getElementById('event-bands'); DATA.events.forEach(function(evt){ var sd=timeToDeg(evt.startTime), ed=timeToDeg(evt.endTime); var d=describeArcBand(CX,CY,sd,ed,DATA.bandOuter,DATA.bandInner); var path=svgEl('path',{d:d,fill:evt.color,'fill-opacity':'0.85',stroke:'rgba(0,0,0,0.15)','stroke-width':'1'}); var title=document.createElementNS(SVG_NS,'title'); title.textContent=evt.title+' ('+evt.startTime+' - '+evt.endTime+')'; path.appendChild(title); g.appendChild(path); }); }",
      "function renderAlarms(){ var g=document.getElementById('alarm-markers'); DATA.events.forEach(function(evt){ if(!evt.alarmEnabled) return; var tt=evt.alarmTriggerPoint==='end'?evt.endTime:evt.startTime; var deg=timeToDeg(tt); var pos=pointOnCircle(CX,CY,DATA.markerR,deg); var size=18; var marker=svgEl('use',{href:'#star-icon',x:pos.x-size/2,y:pos.y-size/2,width:size,height:size}); marker.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#star-icon'); var title=document.createElementNS(SVG_NS,'title'); title.textContent=evt.title+' ('+tt+')'; marker.appendChild(title); g.appendChild(marker); }); }",
      "function renderHand(){ var group=document.getElementById('hand'); group.innerHTML=''; var length=DATA.handLen, thickness=DATA.handThickness, tipY=CY-length; function shaft(toY){ group.appendChild(svgEl('line',{x1:CX,y1:CY,x2:CX,y2:toY,'stroke-width':thickness,'stroke-linecap':'round'})); } if(DATA.handShape==='arrow'){ var headLen=Math.min(length*0.5,Math.max(14,thickness*4)), headW=thickness*2.4, baseY=tipY+headLen; shaft(baseY+1); group.appendChild(svgEl('polygon',{points:CX+','+tipY+' '+(CX-headW/2)+','+baseY+' '+(CX+headW/2)+','+baseY,stroke:'none'})); } else if(DATA.handShape==='diamond'){ var dLen=Math.min(length*0.5,Math.max(16,thickness*4.5)), dW=thickness*2.2, dBaseY=tipY+dLen, dMidY=tipY+dLen/2; shaft(dBaseY+1); group.appendChild(svgEl('polygon',{points:CX+','+tipY+' '+(CX+dW/2)+','+dMidY+' '+CX+','+dBaseY+' '+(CX-dW/2)+','+dMidY,stroke:'none'})); } else if(DATA.handShape==='taper'){ var baseW=thickness*2.4; group.appendChild(svgEl('polygon',{points:(CX-baseW/2)+','+CY+' '+(CX+baseW/2)+','+CY+' '+CX+','+tipY,stroke:'none'})); } else { shaft(tipY); } }",
      "function tick(){ var now=new Date(); var h=now.getHours(), m=now.getMinutes(), s=now.getSeconds(); var deg=((h*3600+m*60+s)/86400)*360; document.getElementById('hand').style.transform='rotate('+deg+'deg)'; document.getElementById('time-text').textContent=pad2(h)+':'+pad2(m)+':'+pad2(s); }",
      "document.getElementById('title-text').textContent=DATA.title;",
      "buildTicks(); renderBands(); renderAlarms(); renderHand(); tick(); setInterval(tick,1000);",
      "<\/script>",
      "</body>",
      "</html>"
    ];

    return lines.join("\n");
  }

  function exportAsHtml() {
    try {
      var html = buildStandaloneClockHtml();
      var blob = new Blob([html], { type: "text/html" });
      downloadBlob(blob, exportFileBaseName() + ".html");
    } catch (e) {
      showToast(t("app.exportErrorTitle"), t("app.exportErrorToast"), "⚠️");
    }
  }

  function initExportMenu() {
    var toggle = document.getElementById("export-toggle");
    var menu = document.getElementById("export-menu");

    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      menu.classList.toggle("hidden");
    });

    document.addEventListener("click", function (e) {
      if (!menu.classList.contains("hidden") && !menu.contains(e.target) && e.target !== toggle) {
        menu.classList.add("hidden");
      }
    });

    document.getElementById("export-image").addEventListener("click", function () {
      menu.classList.add("hidden");
      exportAsImage();
    });

    document.getElementById("export-pdf").addEventListener("click", function () {
      menu.classList.add("hidden");
      exportAsPdf();
    });

    document.getElementById("export-image-full").addEventListener("click", function () {
      menu.classList.add("hidden");
      exportAsImageFull();
    });

    document.getElementById("export-pdf-full").addEventListener("click", function () {
      menu.classList.add("hidden");
      exportAsPdfFull();
    });

    document.getElementById("export-html").addEventListener("click", function () {
      menu.classList.add("hidden");
      exportAsHtml();
    });

    document.getElementById("export-widget").addEventListener("click", function () {
      menu.classList.add("hidden");
      showToast(t("app.comingSoonTitle"), t("app.comingSoonBody"), "🛠️");
    });
  }

  function fireAlarm(evt, triggerTime) {
    var triggerLabel = evt.alarmTriggerPoint === "end" ? t("app.alarmFlagEnd") : t("app.alarmFlagStart");
    var body = t("app.alarmBody", { start: evt.startTime, end: evt.endTime, trigger: triggerLabel });

    playBeep();

    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      new Notification(evt.title, { body: body });
    } else {
      showToast(evt.title, body);
    }
  }

  function checkAlarms() {
    if (viewingDateStr !== todayDateStr()) {
      return;
    }
    var now = new Date();
    var nowHM = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    var fired = false;

    events.forEach(function (evt) {
      if (!evt.alarmEnabled || evt.alarmFiredToday) {
        return;
      }
      var triggerTime = evt.alarmTriggerPoint === "end" ? evt.endTime : evt.startTime;
      if (triggerTime === nowHM) {
        fireAlarm(evt, triggerTime);
        evt.alarmFiredToday = true;
        fired = true;
      }
    });

    if (fired) {
      saveEvents();
      renderEventList();
    }
  }

  function initNotificationBanner() {
    if (typeof Notification === "undefined") {
      return;
    }
    var banner = document.getElementById("notification-banner");

    function refreshBanner() {
      banner.hidden = Notification.permission !== "default";
    }

    refreshBanner();

    document.getElementById("notif-allow-btn").addEventListener("click", function () {
      Notification.requestPermission().then(refreshBanner);
    });
    document.getElementById("notif-dismiss-btn").addEventListener("click", function () {
      banner.hidden = true;
    });
  }

  function initLabelControls() {
    var fontSizeInput = document.getElementById("label-font-size");
    var fontSizeValue = document.getElementById("label-font-size-value");

    fontSizeInput.value = labelSettings.fontSize;
    fontSizeValue.textContent = labelSettings.fontSize + "px";

    fontSizeInput.addEventListener("input", function (e) {
      labelSettings.fontSize = parseInt(e.target.value, 10);
      fontSizeValue.textContent = labelSettings.fontSize + "px";
      saveLabelSettings();
      renderEventBands();
    });
  }

  function initTitleControls() {
    var titleInput = document.getElementById("clock-title-input");
    var modeRadios = document.querySelectorAll('input[name="title-mode"]');
    var fontSelect = document.getElementById("clock-font-select");
    var titleSizeInput = document.getElementById("title-font-size");
    var titleSizeValue = document.getElementById("title-font-size-value");
    var timeSizeInput = document.getElementById("time-font-size");
    var timeSizeValue = document.getElementById("time-font-size-value");

    titleInput.value = titleSettings.titleByLang[window.RoundClockI18n ? window.RoundClockI18n.getLang() : "ko"];
    modeRadios.forEach(function (radio) {
      radio.checked = radio.value === titleSettings.mode;
    });
    fontSelect.value = titleSettings.font;
    titleSizeInput.value = titleSettings.titleFontSize;
    titleSizeValue.textContent = titleSettings.titleFontSize + "px";
    timeSizeInput.value = titleSettings.timeFontSize;
    timeSizeValue.textContent = titleSettings.timeFontSize + "px";

    applyTitleSettings();

    window.addEventListener("roundclock:langchange", function () {
      titleInput.value = titleSettings.titleByLang[window.RoundClockI18n.getLang()];
    });

    titleInput.addEventListener("input", function (e) {
      var currentLang = window.RoundClockI18n ? window.RoundClockI18n.getLang() : "ko";
      titleSettings.titleByLang[currentLang] = e.target.value;
      saveTitleSettings();
      applyTitleSettings();
    });

    modeRadios.forEach(function (radio) {
      radio.addEventListener("change", function (e) {
        if (e.target.checked) {
          titleSettings.mode = e.target.value;
          saveTitleSettings();
          applyTitleSettings();
        }
      });
    });

    fontSelect.addEventListener("change", function (e) {
      titleSettings.font = e.target.value;
      saveTitleSettings();
      applyTitleSettings();
    });

    titleSizeInput.addEventListener("input", function (e) {
      titleSettings.titleFontSize = parseInt(e.target.value, 10);
      titleSizeValue.textContent = titleSettings.titleFontSize + "px";
      saveTitleSettings();
      applyTitleSettings();
    });

    timeSizeInput.addEventListener("input", function (e) {
      titleSettings.timeFontSize = parseInt(e.target.value, 10);
      timeSizeValue.textContent = titleSettings.timeFontSize + "px";
      saveTitleSettings();
      applyTitleSettings();
    });
  }

  function initClockStyleControl() {
    var select = document.getElementById("clock-style-select");
    select.value = currentClockStyleKey;

    select.addEventListener("change", function (e) {
      applyClockStyle(e.target.value);
      saveClockStyle();
    });
  }

  function initThemeControl() {
    var select = document.getElementById("theme-select");
    var theme = loadTheme();
    select.value = theme;
    applyTheme(theme);

    select.addEventListener("change", function (e) {
      applyTheme(e.target.value);
      saveTheme(e.target.value);
    });
  }

  function initBandThicknessControl() {
    var thicknessInput = document.getElementById("band-thickness");
    var thicknessValue = document.getElementById("band-thickness-value");

    thicknessInput.addEventListener("input", function (e) {
      var value = parseInt(e.target.value, 10);
      clockThickness[currentClockStyleKey] = value;
      thicknessValue.textContent = value + "px";
      saveBandThickness();
      applyClockStyle(currentClockStyleKey);
    });
  }

  function initHandControls() {
    var shapeSelect = document.getElementById("hand-shape-select");
    var thicknessInput = document.getElementById("hand-thickness");
    var thicknessValue = document.getElementById("hand-thickness-value");

    shapeSelect.value = handSettings.shape;
    thicknessInput.value = handSettings.thickness;
    thicknessValue.textContent = handSettings.thickness + "px";

    shapeSelect.addEventListener("change", function (e) {
      handSettings.shape = e.target.value;
      saveHandSettings();
      renderHandShape();
    });

    thicknessInput.addEventListener("input", function (e) {
      handSettings.thickness = parseInt(e.target.value, 10);
      thicknessValue.textContent = handSettings.thickness + "px";
      saveHandSettings();
      renderHandShape();
    });
  }

  function init() {
    currentDateStr = todayDateStr();
    viewingDateStr = currentDateStr;

    loadLabelSettings();
    loadTitleSettings();
    loadClockStyle();
    loadBandThickness();
    loadHandSettings();
    renderSwatches();
    loadEvents();
    seedExampleEventsIfFirstVisit();
    applyClockStyle(currentClockStyleKey);
    initLabelControls();
    initTitleControls();
    initClockStyleControl();
    initBandThicknessControl();
    initHandControls();
    initThemeControl();
    initClockFaceDragCreate();
    initDateNav();
    initImportDate();

    document.getElementById("event-form").addEventListener("submit", handleFormSubmit);
    document.getElementById("alarm-enabled").addEventListener("change", function (e) {
      document.getElementById("alarm-trigger-point").disabled = !e.target.checked;
    });

    initNotificationBanner();
    initExportMenu();

    updateClockHand();
    setInterval(updateClockHand, 1000);
    setInterval(checkAlarms, ALARM_CHECK_INTERVAL_MS);

    var resizeTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(adjustClockSpacing, 150);
    });

    window.addEventListener("roundclock:langchange", function () {
      applyTitleSettings();
      refreshAll();
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
